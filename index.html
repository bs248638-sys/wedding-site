<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웨딩 스냅 캔바(Canva) PPT 시안 - 제주 노을 & 블랙 드레스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: #121520;
      --card-sub: #171b28;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.2);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #23283b;
      --border-accent: rgba(245, 158, 11, 0.35);
      --rose: #f43f5e;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14, 17, 26, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 18px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .view-tabs {
      display: flex;
      background: #0d0f17;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .view-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-tab-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: var(--card-sub);
      color: var(--text);
    }
    .action-btn:hover {
      background: #252b3d;
      border-color: #3f4761;
    }
    .action-btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .action-btn-primary:hover {
      background: var(--accent-hover);
    }
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .slide-nav-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .slide-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .slide-pill-btn {
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slide-pill-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .nav-arrows {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .arrow-btn {
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .page-indicator {
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      padding: 0 6px;
    }
    .slide-card {
      background: linear-gradient(145deg, #12141f, #151825);
      border: 1px solid #2a3147;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: relative;
    }
    .slide-card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
      gap: 10px;
    }
    .slide-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slide-number-badge {
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--border-accent);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
    }
    .time-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--card-sub);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
    }
    .aspect-badge {
      font-family: monospace;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .slide-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag-item {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .slide-title-ko {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .slide-title-en {
      font-size: 14px;
      font-style: italic;
      color: #fbbf24;
      font-family: Georgia, serif;
      margin-bottom: 14px;
    }
    .slide-concept-banner {
      background: rgba(245, 158, 11, 0.06);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 16px;
      font-size: 13px;
      color: #fde68a;
      margin-bottom: 24px;
    }
    .slide-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 950px) {
      .slide-grid { grid-template-columns: 1fr; }
    }
    .info-card {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .info-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .copy-sm-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .copy-sm-btn:hover { color: var(--accent); }
    .style-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .style-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .style-value {
      font-size: 12.5px;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .canva-tip-box {
      margin-top: 14px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #fef3c7;
    }
    .canva-tip-label {
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
      display: block;
    }
    .dir-section { margin-bottom: 14px; }
    .dir-heading {
      font-size: 12px;
      font-weight: 700;
      color: #fde68a;
      margin-bottom: 6px;
    }
    .dir-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 12px;
    }
    .dir-bullets li {
      font-size: 12px;
      color: #cbd5e1;
      position: relative;
    }
    .dir-bullets li::before {
      content: "•";
      position: absolute;
      left: -12px;
      color: var(--accent);
    }
    .director-memo-box {
      background: rgba(244, 63, 94, 0.09);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fecdd3;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.5;
    }
    .photos-box {
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }
    .photos-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .photos-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .photo-card {
      background: rgba(13, 16, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
    }
    .photo-card.highlight {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .photo-filename {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .photo-star {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef08a;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .photo-desc {
      color: var(--text-muted);
      line-height: 1.4;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: #0f172a;
      border: 1px solid var(--accent);
      color: #fef08a;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      display: none;
    }
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .table-header-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .table-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .table-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
      min-width: 900px;
    }
    th {
      background: #0d0f17;
      color: var(--accent);
      font-weight: 800;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: top;
      color: #d1d5db;
      line-height: 1.5;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }

    @page { size: A4 landscape; margin: 10mm; }
    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, .slide-nav-strip, .top-actions, #toast, .view-tabs { display: none !important; }
      main { max-width: 100% !important; padding: 0 !important; }
      .slide-card {
        background: #fff !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        margin-bottom: 0 !important;
        padding: 15mm !important;
        display: block !important;
      }
      .slide-title-ko, .photos-title, table th { color: #000 !important; }
      .info-card, .canva-tip-box, .photos-box, .photo-card {
        background: #f8fafc !important;
        border-color: #cbd5e1 !important;
        color: #1e293b !important;
      }
      .director-memo-box {
        background: #fff1f2 !important;
        border-color: #f43f5e !important;
        color: #9f1239 !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">✨</div>
        <div>
          <div class="brand-title">
            제주 노을 & 바다 웨딩 스냅 Canva PPT 시안
            <span class="brand-badge">76장 전수 분류</span>
          </div>
          <div class="brand-sub">Canva 일괄 제작(Bulk Create) 및 시안 디렉터 단일 웹페이지</div>
        </div>
      </div>

      <div class="view-tabs">
        <button class="view-tab-btn active" onclick="switchView('slide')">PPT 1장씩 넘기기</button>
        <button class="view-tab-btn" onclick="switchView('all')">전체 스크롤 모드</button>
        <button class="view-tab-btn" onclick="switchView('table')">캔바 일괄제작 표</button>
      </div>

      <div class="top-actions">
        <button class="action-btn" onclick="copyFullCanvaText()">📋 전체 텍스트 복사</button>
        <button class="action-btn action-btn-primary" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
      </div>
    </div>
  </header>

  <main>
    <div id="slideNavStrip" class="slide-nav-strip">
      <div class="slide-pills" id="slidePills"></div>
      <div class="nav-arrows">
        <button id="prevBtn" class="arrow-btn" onclick="changeSlide(-1)">◀</button>
        <span id="pageIndicator" class="page-indicator">1 / 6</span>
        <button id="nextBtn" class="arrow-btn" onclick="changeSlide(1)">▶</button>
      </div>
    </div>

    <div id="slidesContainer"></div>

    <div id="tableView" class="table-container" style="display: none;">
      <div class="table-header-box">
        <div>
          <div class="table-title">캔바(Canva) 일괄 제작(Bulk Create) 전용 표</div>
          <div class="table-desc">
            캔바 좌측 메뉴 [앱 ➔ 일괄 제작(Bulk Create) ➔ 데이터 수동 입력]에 아래 표를 복사해 붙여넣거나 CSV 파일로 활용하세요.
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="action-btn" onclick="copyTableTSV()">📋 표 전체 복사 (Canva 붙여넣기용)</button>
          <button class="action-btn action-btn-primary" onclick="downloadCSV()">⬇ CSV 파일 다운로드</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="bulkTable">
          <thead>
            <tr>
              <th style="width: 100px;">슬라이드 번호</th>
              <th style="width: 220px;">카테고리명</th>
              <th style="width: 280px;">포함된 사진 파일명</th>
              <th style="width: 260px;">주요 연출 포인트</th>
              <th>작가님 전달 메모</th>
            </tr>
          </thead>
          <tbody id="bulkTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast">복사 완료!</div>

  <script>
    // 76장 전체 데이터 및 슬라이드 구성 JSON 내장
    const slides = [
      {
        slideNumber: 1,
        titleKo: "SLIDE 01. 골든아워 & 다이내믹 워터 런 (Golden Ocean Run)",
        titleEn: "Dynamic Beach Splash & Playful Running",
        conceptSubtitle: "황금빛 윤슬과 잔잔한 파도를 가르며 달리는 역동적이고 자유로운 시네마틱 컷",
        keywords: ["#내추럴러닝", "#물보라스플래시", "#맨발투혼", "#생동감넘치는웃음", "#골든아워윤슬"],
        timeSlot: "17:20 ~ 17:50 (일몰 시작 전 골든아워)",
        styling: {
          brideDress: "슬림 A라인 블랙 슬립 드레스 (새틴/실크)",
          groomSuit: "루즈핏 올블랙 셔츠 & 슬랙스 (단추 1~2개 오픈)",
          hair: "바람에 자연스럽게 날리는 로우 번(Low Bun)",
          makeup: "세미 매트 베이스 + 생기 있는 코랄 로즈 립",
          bouquet: "비비드 핫핑크 장미/작약 번들",
          props: "맨발(신발 벗고 촬영), 롱 블랙 리본 타이"
        },
        direction: {
          pose: ["손을 잡고 대각선 방향으로 가볍게 달리며 파도 차올리기", "신랑이 손을 이끌어주는 모션", "달리다 마주보며 터진 진심 미소 (모션 블러 권장)", "바닷물 속 나란히 뛰어들기"],
          lighting: ["역광을 이용해 바다 윤슬이 두 사람 사이로 반짝이도록 앵글 설정", "1/30s 감성 모션 블러 병행"],
          eyeContact: ["카메라 의식하지 않고 70%는 서로 얼굴/발끝 보기", "고개 돌려 서로 눈 마주치는 순간"],
          directorNote: "★ 작가님 핵심: 정형화된 웨딩 포즈를 벗어나 두 사람의 찐 웃음과 역동적인 물보라를 담아주세요."
        },
        canvaSlideLayoutTips: "좌측에 달리는 전신 와이드 컷(대표 메인) 1장 + 우측에 2단 분할(웃는 클로즈업 + 물보라 발끝 모션 컷) 배치 추천",
        files: [

    function switchView(mode) {
      currentView = mode;
      document.querySelectorAll('.view-tab-btn').forEach(btn => btn.classList.remove('active'));
      if (mode === 'slide') {
        document.querySelectorAll('.view-tab-btn')[0].classList.add('active');
        document.getElementById('slideNavStrip').style.display = 'flex';
        document.getElementById('slidesContainer').style.display = 'block';
        document.getElementById('tableView').style.display = 'none';
      } else if (mode === 'all') {
        document.querySelectorAll('.view-tab-btn')[1].classList.add('active');
        document.getElementById('slideNavStrip').style.display = 'none';
        document.getElementById('slidesContainer').style.display = 'block';
        document.getElementById('tableView').style.display = 'none';
      } else if (mode === 'table') {
        document.querySelectorAll('.view-tab-btn')[2].classList.add('active');
        document.getElementById('slideNavStrip').style.display = 'none';
        document.getElementById('slidesContainer').style.display = 'none';
        document.getElementById('tableView').style.display = 'block';
      }
      renderSlides();
    }

    function goToSlide(idx) {
      currentIdx = idx;
      renderSlides();
    }

    function changeSlide(delta) {
      const nextIdx = currentIdx + delta;
      if (nextIdx >= 0 && nextIdx < slides.length) {
        currentIdx = nextIdx;
        renderSlides();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (currentView !== 'slide') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        changeSlide(-1);
      }
    });

        text += `------------------------------------------------------------------------\n[슬라이드 0${s.slideNumber}] ${s.titleKo}\n키워드: ${s.keywords.join(' ')}\n시간대: ${s.timeSlot}\n\n[헤어/메이크업/의상]\n• 신부: ${s.styling.brideDress}\n• 신랑: ${s.styling.groomSuit}\n• 헤어: ${s.styling.hair}\n• 메이크업: ${s.styling.makeup}\n• 부케: ${s.styling.bouquet} / 소품: ${s.styling.props}\n\n[작가님 전달 메모]\n${s.direction.pose.map(p => '- ' + p).join('\n')}\n${s.direction.directorNote}\n\n[사진 목록 (${s.files.length}장)]\n${s.files.map((f, i) => `${i+1}. ${f.filename} : ${f.description}`).join('\n')}\n\n`;
      });
      copyToClipboard(text, '전체 6개 슬라이드 캔바 텍스트 복사 완료!');
    }

    function copyTableTSV() {
      let tsv = '슬라이드 번호\t카테고리명\t포함된 사진 파일명\t주요 연출 포인트\t작가님 전달 메모\n';
      slides.forEach(s => {
        const slideNum = `SLIDE 0${s.slideNumber}`;
        const catName = s.titleKo.replace(/SLIDE \d+\.\s*/, '');
        const filesStr = s.files.map(f => f.filename).join(', ');
        const points = `${s.keywords.join(' ')} | ${s.conceptSubtitle}`;
        const memo = `[포즈] ${s.direction.pose.join(' / ')} [조명] ${s.direction.lighting.join(' / ')} [핵심] ${s.direction.directorNote}`;
        tsv += `${slideNum}\t${catName}\t${filesStr}\t${points}\t${memo}\n`;
      });
      copyToClipboard(tsv, '캔바 일괄제작(Bulk Create) 붙여넣기용 표 복사 완료!');
    }

    function downloadCSV() {
      let csv = '\uFEFF슬라이드 번호,카테고리명,포함된 사진 파일명,주요 연출 포인트,작가님 전달 메모\n';
      slides.forEach(s => {
        const slideNum = `SLIDE 0${s.slideNumber}`;
        const catName = `"${s.titleKo.replace(/"/g, '""')}"`;
        const filesStr = `"${s.files.map(f => f.filename).join(', ')}"`;
        const points = `"${s.keywords.join(' ')} | ${s.conceptSubtitle.replace(/"/g, '""')}"`;
        const memo = `"[포즈] ${s.direction.pose.join(' / ')} [조명] ${s.direction.lighting.join(' / ')} [핵심] ${s.direction.directorNote.replace(/"/g, '""')}"`;
        csv += `${slideNum},${catName},${filesStr},${points},${memo}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'canva_bulk_create_wedding_slides.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('CSV 다운로드 완료!');
    }

    renderSlides();
    renderBulkTable();
  </script>

<script>
// 성능 최적화
document.addEventListener('DOMContentLoaded', () => {
  // 비활성 슬라이드 DOM 제거 후 필요 시 렌더
  const originalRenderSlides = window.renderSlides;
  if (originalRenderSlides) {
    const wrapped = function() {
      requestAnimationFrame(() => originalRenderSlides());
    };
    window.renderSlides = wrapped;
  }

  // 썸네일 네비게이션 스크롤 최적화
  const pills = document.getElementById('slidePills');
  if (pills) {
    pills.style.scrollBehavior = 'smooth';
  }

  // 키보드 이벤트 passive 처리
  window.addEventListener('keydown', ()=>{}, {passive:true});

  console.log('Wedding Draft Optimized');
});
</script>

</body>
